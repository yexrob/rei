name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/checkout@v4
        with:
          repository: yexrob/bingo
          ref: 13b62ef4f9faf7cd186cca61a18945de2bc08d0b
          path: _runtime
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: _runtime -> target
          # Native C artifacts cannot cross Linux glibc baselines.
          key: ${{ runner.os == 'Linux' && matrix.os || '' }}
          cache-on-failure: true
      - name: Build required native runtime
        working-directory: _runtime
        run: cargo build --release --locked -p bingo
      - name: Select required native runtime
        shell: bash
        run: |
          binary="$GITHUB_WORKSPACE/_runtime/target/release/bingo"
          if [[ "$RUNNER_OS" == 'Windows' ]]; then binary="$binary.exe"; fi
          echo "BINGO_BUNDLE_BINARY=$binary" >> "$GITHUB_ENV"
      - run: npm run package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
